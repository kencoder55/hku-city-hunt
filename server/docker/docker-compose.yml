name: hku-city-hunt
services:
  db:
    platform: linux/amd64
    image: mysql:8.0.23
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: hku_city_hunt_db
      MYSQL_USER: cms
      MYSQL_PASSWORD: 'Abcd##1234'
      TZ: Asia/Hong_Kong
    ports:
      - 9716:3306
    volumes:
      - hku_city_hunt_db:/var/lib/mysql
    tty: true
  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - 9712:8080
volumes:
  hku_city_hunt_db:
networks:
  default:
    ipam:
      config:
        - subnet: 10.97.16.0/24
